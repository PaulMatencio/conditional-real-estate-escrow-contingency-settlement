# Local Midnight proof server for Wallet Mode. Bound to loopback only: proof requests carry the circuit's private
# inputs (including your token secret key), so the prover must never be reachable from the network.
#   npm run proof-server:start      npm run proof-server:stop
# The image tag must match the ledger version the app was built against: Compact 0.36 / ledger 9 → proof-server 9.0.1
# (it proves the contract's ZKIR v3 circuits and the wallet's v2 ones; proof-server 8.x answers "Unsupported ZKIR version").
services:
  proof-server:
    image: 'midnightntwrk/proof-server:9.0.1'
    command: ['midnight-proof-server', '-v']
    ports:
      - '127.0.0.1:6300:6300'
    environment:
      RUST_BACKTRACE: 'full'
    healthcheck:
      test: ['CMD-SHELL', 'echo > /dev/tcp/127.0.0.1/6300']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

